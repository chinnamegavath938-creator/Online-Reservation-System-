<html lang="en">
<head>

  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2d40;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh}.topbar{height:70px;background:#10253f;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1050px)/2))}.brand{font-weight:750;letter-spacing:.04em}.user{color:#d2deed;font-size:14px}.link{color:white;background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit;margin-left:10px}.wrap{max-width:1050px;margin:38px auto;padding:0 22px}.hero{margin-bottom:24px}.eyebrow{color:#2d6b9f;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(29px,4vw,40px);letter-spacing:-.04em;margin:7px 0}.sub{margin:0;color:#68788b}.tabs{display:flex;border-bottom:1px solid #d9e1e9;margin-bottom:20px;gap:8px}.tab{border:0;background:none;padding:12px 16px;color:#617286;font-size:14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tab.active{color:#1e5f96;border-color:#2875ae}.card{background:white;border:1px solid #e3e9f0;border-radius:15px;padding:26px;box-shadow:0 8px 30px #243d5910}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 19px}.field label{display:block;font-size:13px;font-weight:700;color:#394d63;margin-bottom:7px}.field input,.field select{width:100%;height:44px;border:1px solid #d5dfe8;border-radius:8px;padding:0 11px;background:white;color:#20344b;font:15px system-ui}.field input:focus,.field select:focus{outline:3px solid #4386bb25;border-color:#4386bb}.field input[readonly]{background:#f3f6f9;color:#65778b}.wide{grid-column:span 2}.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:23px}.hint,.small{font-size:13px;color:#728196}.primary,.danger{border:0;border-radius:8px;padding:12px 18px;color:white;font-size:14px;font-weight:750;cursor:pointer;background:#236da5}.danger{background:#b64343}.primary:hover{background:#175b91}.danger:hover{background:#a33333}.flash{padding:12px 14px;border-radius:8px;background:#edf7ed;color:#246939;margin:0 0 16px}.flash.error{background:#fff0ee;color:#a13d32}.booking{padding:16px;background:#f4f8fc;border:1px solid #dce7f1;border-radius:10px;white-space:pre-line;line-height:1.8;color:#354a60}.foot{color:#8996a5;text-align:center;font-size:12px;margin:24px auto 30px}.modal{position:fixed;inset:0;background:#0e203a88;display:grid;place-items:center;padding:18px}.dialog{background:white;border-radius:14px;padding:25px;max-width:460px;width:100%;box-shadow:0 18px 60px #0003}.dialog h2{margin:0 0 8px}.dialog p{line-height:1.5;color:#68788b}.dialog-actions{display:flex;justify-content:end;gap:10px}.secondary{border:1px solid #d6dfe8;background:white;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:650}.login{max-width:420px;margin:65px auto}.login .field{margin:17px 0}.login .primary{width:100%}.notice{font-size:12px;color:#8693a3;line-height:1.55;margin-top:16px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e7edf3;white-space:nowrap}th{color:#52677e;background:#f6f8fa}.report-section{margin:22px 0 9px;font-size:15px;color:#253e57}
    .text-action{display:block;margin-top:14px;padding:0;border:0;background:none;color:#236da5;font:600 14px system-ui;text-decoration:underline;cursor:pointer}.home-wrap{max-width:1160px;margin:0 auto;padding:0 24px}.home-hero{position:relative;overflow:hidden;border-radius:0 0 28px 28px;background:linear-gradient(112deg,#10253f 4%,#183e62 62%,#276f99);color:#fff;padding:62px max(30px,calc((100% - 1060px)/2));margin:0 calc((1160px - min(100vw,1160px))/2) 0;min-height:355px}.home-hero:after{content:'✈';position:absolute;right:12%;top:26px;font-size:210px;color:#ffffff12;transform:rotate(-14deg)}.home-hero .eyebrow{color:#f2c879}.home-hero h1{max-width:580px;font-size:clamp(38px,6vw,62px);line-height:1.04;margin:12px 0}.home-hero p{max-width:480px;color:#d1e1ed;line-height:1.65;margin:0}.search-card{position:relative;z-index:1;margin:-45px auto 0;max-width:1080px;background:white;border-radius:15px;padding:22px;box-shadow:0 14px 42px #132b431c}.search-grid{display:grid;grid-template-columns:1.2fr 1.2fr 1fr auto;align-items:end;gap:13px}.search-grid .field label{font-size:12px}.search-grid .field select,.search-grid .field input{height:48px}.home-section{margin:54px auto 0;max-width:1080px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:19px}.section-head h2{margin:5px 0;font-size:26px;letter-spacing:-.025em}.route-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.route-card{overflow:hidden;background:white;border:1px solid #e3e9f0;border-radius:14px;box-shadow:0 8px 26px #243d590a}.route-art{height:130px;background:linear-gradient(135deg,#72a8bd,#d2e7e7);display:flex;align-items:end;padding:15px;color:white;font-size:26px;font-weight:800;text-shadow:0 2px 12px #0005}.route-card:nth-child(2) .route-art{background:linear-gradient(135deg,#d1a783,#f0d5b5)}.route-card:nth-child(3) .route-art{background:linear-gradient(135deg,#758db2,#d7b9cb)}.route-content{padding:16px}.route-content h3{margin:0 0 4px;font-size:17px}.route-content p{margin:0 0 14px;color:#718094;font-size:13px}.route-content button{padding:9px 13px}.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:28px auto 0;max-width:1080px}.feature{background:#eaf1f6;border-radius:12px;padding:17px}.feature strong{display:block;margin-bottom:4px}.feature span{color:#6b7c8e;font-size:13px}.home-nav{display:flex;align-items:center;gap:17px}.nav-button{border:0;background:transparent;color:#e4edf5;font:600 14px system-ui;cursor:pointer}.nav-cta{border:0;background:#e6b353;color:#142c45;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer}.search-results{margin-top:22px}.flight-result{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid #e7edf3}.flight-result small{display:block;color:#748398;margin-top:4px}@media(max-width:760px){.home-hero{padding:49px 23px 70px;min-height:320px}.home-hero:after{right:-8%;top:50px;font-size:145px}.search-grid{grid-template-columns:1fr 1fr}.search-grid .primary{grid-column:span 2}.route-grid{grid-template-columns:1fr 1fr}.home-nav{gap:8px}.nav-button{display:block}}@media(max-width:520px){.home-wrap{padding:0 14px}.brand{font-size:12px}.nav-cta{font-size:12px;padding:9px}.route-grid,.feature-strip{grid-template-columns:1fr}.search-grid{grid-template-columns:1fr}.search-grid .primary{grid-column:auto}.section-head{align-items:start;flex-direction:column}.home-hero{border-radius:0 0 20px 20px}}
    @media(max-width:650px){.topbar{padding:0 16px}.wrap{margin:26px auto;padding:0 14px}.card{padding:18px}.grid{grid-template-columns:1fr;gap:14px}.wide{grid-column:span 1}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}.tabs{gap:0}.tab{padding:12px 10px}}
    .brand{display:flex;align-items:center;gap:10px}.brand-mark{display:flex;flex-direction:column;align-items:center;line-height:1}.brand-flight{font-size:20px}.watermark{margin-top:4px;font-size:9px;font-weight:500;letter-spacing:.12em;color:#d2deed99}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark"><span class="brand-flight">✈</span><span class="watermark">Chinna</span></span><span class="brand-title">FLIGHT RESERVATION</span></div><div class="user" id="userArea"></div></header>
  <main class="wrap" id="app"></main>
  <div class="foot">Browser demo · Data is stored in this browser only · Use the Java app for SQLite and Twilio SMS</div>
  <div id="modalRoot"></div>
<script>
(() => {
  const flights={'AI101':'Air India · Delhi to Mumbai','AI202':'Air India · Mumbai to Bengaluru','6E305':'IndiGo · Delhi to Goa','6E412':'IndiGo · Bengaluru to Kolkata','UK811':'Vistara · Delhi to Chennai'};
  const capacities={'Economy':45,'Premium Economy':45,'Business':45,'First Class':45};
  const app=document.querySelector('#app'), userArea=document.querySelector('#userArea'), modalRoot=document.querySelector('#modalRoot');
  const bookings=()=>JSON.parse(localStorage.getItem('flightBookings')||'{}');
  const customerAccounts=()=>JSON.parse(localStorage.getItem('flightCustomerAccounts')||'{}');
  const save=data=>localStorage.setItem('flightBookings',JSON.stringify(data));
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const who=()=>sessionStorage.getItem('flightUser');
  const role=()=>sessionStorage.getItem('flightRole')||(who()==='admin'?'ADMIN':'CUSTOMER');
  const csv=value=>'"'+String(value??'').replaceAll('"','""')+'"';
  const normalizeMobile=value=>{let number=value.trim().replace(/[\s().-]/g,'');if(/^[6-9]\d{9}$/.test(number))return '+91'+number;if(/^0[6-9]\d{9}$/.test(number))return '+91'+number.slice(1);if(/^91[6-9]\d{9}$/.test(number))return '+'+number;if(/^0091[6-9]\d{9}$/.test(number))return '+'+number.slice(2);return /^\+[1-9]\d{7,14}$/.test(number)?number:null;};
  const homeMarkup=()=>`<section class="home-hero"><div class="eyebrow">A better way to fly</div><h1>Your next great trip starts here.</h1><p>Compare our featured routes, reserve your seat in minutes, and keep every trip detail close at hand.</p></section><section class="search-card"><form id="flightSearch" class="search-grid"><div class="field"><label for="searchFrom">FROM</label><select id="searchFrom"><option value="">Any departure</option>${['Delhi','Mumbai','Bengaluru','Kolkata','Goa','Chennai'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="searchTo">TO</label><select id="searchTo"><option value="">Any destination</option>${['Delhi','Mumbai','Bengaluru','Kolkata','Goa','Chennai'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label for="searchDate">DEPARTURE</label><input id="searchDate" type="date" required></div><button class="primary">Find flights</button></form><div id="searchResults" class="search-results"></div></section><section class="home-section"><div class="section-head"><div><div class="eyebrow">Make the most of your trip</div><h2>Popular routes</h2></div><span class="small">A few journeys to get you going</span></div><div class="route-grid"><article class="route-card"><div class="route-art">DEL&nbsp; → &nbsp;BOM</div><div class="route-content"><h3>Delhi to Mumbai</h3><p>AI101 · Sample route</p><button class="primary" data-route="AI101" data-from="Delhi" data-to="Mumbai">Choose flight</button></div></article><article class="route-card"><div class="route-art">BLR&nbsp; → &nbsp;CCU</div><div class="route-content"><h3>Bengaluru to Kolkata</h3><p>6E412 · Sample route</p><button class="primary" data-route="6E412" data-from="Bengaluru" data-to="Kolkata">Choose flight</button></div></article><article class="route-card"><div class="route-art">DEL&nbsp; → &nbsp;GOI</div><div class="route-content"><h3>Delhi to Goa</h3><p>6E305 · Sample route</p><button class="primary" data-route="6E305" data-from="Delhi" data-to="Goa">Choose flight</button></div></article></div></section><section class="feature-strip"><div class="feature"><strong>✦ &nbsp; Straightforward booking</strong><span>Passenger details, flight, and seat together in one simple flow.</span></div><div class="feature"><strong>◷ &nbsp; Booking details on hand</strong><span>Find an active reservation whenever you need it.</span></div><div class="feature"><strong>▦ &nbsp; Clear seat availability</strong><span>See available seats by flight, travel date, and class.</span></div></section>`;
  function bindHome(){
    app.ondblclick=null;
    if(!who())app.ondblclick=event=>{if(event.target.closest('button,input,select,textarea,a'))return;login('ADMIN');};
    const date=document.querySelector('#searchDate');date.min=new Date().toISOString().slice(0,10);date.value=date.min;
    document.querySelector('#flightSearch').addEventListener('submit',e=>{e.preventDefault();const from=document.querySelector('#searchFrom').value,to=document.querySelector('#searchTo').value,journey=date.value;if(from&&to&&from===to){showSearchMessage('Choose different departure and destination cities.');return;}const matches=Object.entries(flights).filter(([,name])=>{const route=name.toLowerCase().split('·')[1]||'';return(!from||route.includes(from.toLowerCase()))&&(!to||route.includes(to.toLowerCase()));});const results=document.querySelector('#searchResults');if(!matches.length){results.innerHTML='<p class="flash error">No sample flights match that route. Try another city pair.</p>';return;}results.innerHTML=`<h3 class="report-section">${matches.length} sample flight${matches.length===1?'':'s'} for ${esc(journey)}</h3>${matches.map(([code,name])=>`<div class="flight-result"><div><b>${esc(code)}</b> · ${esc(name)}<small>Economy seats available: ${capacities.Economy-countFor(code,journey,'Economy')} &nbsp;·&nbsp; Demo schedule</small></div><button class="primary" data-book-flight="${esc(code)}" data-from="${esc(from||'')}" data-to="${esc(to||'')}" data-date="${esc(journey)}">Book this flight</button></div>`).join('')}`;results.querySelectorAll('[data-book-flight]').forEach(button=>button.addEventListener('click',()=>chooseFlight(button.dataset.bookFlight,button.dataset.from,button.dataset.to,button.dataset.date)));});
    document.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>chooseFlight(button.dataset.route,button.dataset.from,button.dataset.to,'')));
  }
  function showSearchMessage(message){const results=document.querySelector('#searchResults');results.innerHTML=`<p class="flash error">${esc(message)}</p>`;}
  function chooseFlight(flight,source='',destination='',date=''){sessionStorage.setItem('pendingFlight',JSON.stringify({flight,source,destination,date}));if(!who()){login();return;}showTab('book');}
  function login(loginRole='CUSTOMER',message=''){
    app.ondblclick=null;
    userArea.innerHTML=`<button class="nav-button" id="returnHome">Home</button>`;
    const admin=loginRole==='ADMIN', title=admin?'Administrator sign in':'Customer sign in';
    app.innerHTML=`<section class="card login"><div class="eyebrow">${admin?'Manage flights and reservations':'Your next journey starts here'}</div><h1>${title}</h1><p class="sub">${admin?'Access booking records and seat availability reports.':'Sign in to book flights and manage your reservations.'}</p>${message?`<p class="flash error">${esc(message)}</p>`:''}<form id="loginForm"><div class="field"><label for="username">${admin?'Admin username':'Customer username'}</label><input id="username" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary">Sign in as ${admin?'admin':'customer'}</button></form>${admin?'<p class="notice">Administrator sign in.</p>':'<button class="text-action" type="button" id="registerLink">New customer? Create an account</button><p class="notice">Customer accounts are saved in this browser. SMS sending is available in the Java app when Twilio credentials are configured.</p>'}</section>`;
    document.querySelector('#returnHome').addEventListener('click',homeView);
    if(!admin)document.querySelector('#registerLink').addEventListener('click',registerView);
    document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const u=document.querySelector('#username').value.trim().toLowerCase(),p=document.querySelector('#password').value;let ok=false;try{if(admin)ok=u==='admin'&&p==='admin123';else{const account=customerAccounts()[u];ok=!!account&&await passwordMatches(p,account);}}catch(error){login(loginRole,'Could not verify account in this browser. Try a current browser or the Java app.');return;}if(ok){sessionStorage.setItem('flightUser',u);sessionStorage.setItem('flightRole',loginRole);render();}else login(loginRole,'Access denied. Check your credentials or create a customer account.');});
  }
  async function passwordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  async function passwordMatches(password,account){const salt=Uint8Array.from(account.salt.match(/.{2}/g),byte=>parseInt(byte,16));return await passwordHash(password,salt)===account.hash;}
  function registerView(message=''){
    userArea.innerHTML='<button class="nav-button" id="backHome">Home</button><button class="nav-button" id="backLogin">Customer sign in</button>';
    app.innerHTML=`<section class="card login"><div class="eyebrow">Create your account</div><h1>Join as a customer</h1><p class="sub">Register once, then sign in to book and manage your flights.</p>${message?`<p class="flash error">${esc(message)}</p>`:''}<form id="registerForm"><div class="field"><label for="newUsername">Username (3–24 letters, numbers, or underscores)</label><input id="newUsername" minlength="3" maxlength="24" autocomplete="username" required></div><div class="field"><label for="newPassword">Password (at least 8 characters)</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="primary">Create account</button></form><p class="notice">This standalone browser demo stores accounts only in this browser. For shared customer accounts use the Java app.</p></section>`;
    document.querySelector('#backHome').addEventListener('click',homeView);document.querySelector('#backLogin').addEventListener('click',()=>login('CUSTOMER'));
    document.querySelector('#registerForm').addEventListener('submit',async e=>{e.preventDefault();const username=document.querySelector('#newUsername').value.trim().toLowerCase(),password=document.querySelector('#newPassword').value,confirm=document.querySelector('#confirmPassword').value;if(!/^[a-z0-9_]{3,24}$/.test(username)){registerView('Use 3–24 letters, numbers, or underscores for the username.');return;}if(password.length<8){registerView('Use a password with at least 8 characters.');return;}if(password!==confirm){registerView('The passwords do not match.');return;}const all=customerAccounts();if(all[username]){registerView('That username is already registered. Try signing in.');return;}try{const salt=crypto.getRandomValues(new Uint8Array(16)),saltHex=[...salt].map(b=>b.toString(16).padStart(2,'0')).join('');all[username]={salt:saltHex,hash:await passwordHash(password,salt)};localStorage.setItem('flightCustomerAccounts',JSON.stringify(all));login('CUSTOMER','Account created. Sign in with your new credentials.');}catch(error){registerView('Account registration needs browser cryptography. Open this page in a current browser or use the Java app.');}});
  }
  function render(){
    app.ondblclick=null;
    if(!who()){homeView();return;}
    const admin=role()==='ADMIN';
    userArea.innerHTML=`<div class="home-nav"><button class="nav-button" id="homeNav">Home</button>${admin?'<button class="nav-button" id="manageNav">Admin report</button>':'<button class="nav-button" id="manageNav">My bookings</button>'}<span>${admin?'Admin':'Customer'}: <b>${esc(who())}</b></span><button class="link" id="signOut">Sign out</button></div>`;
    app.innerHTML=`<div class="hero"><div class="eyebrow">${admin?'Reservation management':'Book, manage, and track'}</div><h1>${admin?'Admin dashboard':'Flight reservations'}</h1><p class="sub">${admin?'Review passenger bookings and download seat availability.':'Reserve your seat and manage your reservations by PNR.'}</p></div><nav class="tabs"><button class="tab active" data-tab="home">Home</button>${admin?'<button class="tab" data-tab="admin">Admin report</button>':'<button class="tab" data-tab="book">Book a flight</button><button class="tab" data-tab="cancel">My bookings</button>'}</nav><section class="card" id="panel"></section>`;
    document.querySelector('#signOut').addEventListener('click',()=>{sessionStorage.removeItem('flightUser');sessionStorage.removeItem('flightRole');render();});
    document.querySelector('#homeNav').addEventListener('click',()=>showTab('home'));document.querySelector('#manageNav').addEventListener('click',()=>showTab(admin?'admin':'cancel'));
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
    const pending=sessionStorage.getItem('pendingFlight');if(pending&&!admin){showTab('book');}else showTab('home');
  }
  function homeView(){userArea.innerHTML=`<div class="home-nav"><button class="nav-button" id="homeNav">Home</button><button class="nav-cta" id="customerSignIn">Register / Sign in</button></div>`;app.innerHTML=homeMarkup();bindHome();document.querySelector('#customerSignIn').addEventListener('click',()=>login('CUSTOMER'));document.querySelector('#homeNav').addEventListener('click',homeView);}
  function showTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){if(role()==='ADMIN')adminHome();else{document.querySelector('#panel').innerHTML=homeMarkup();bindHome();}}else if(tab==='book'&&role()==='CUSTOMER')bookView();else if(tab==='cancel'&&role()==='CUSTOMER')cancelView();else if(tab==='admin'&&role()==='ADMIN')adminView();}
  function adminHome(){document.querySelector('#panel').innerHTML=`<div class="eyebrow">Administrator tools</div><h2>Bookings and seat availability</h2><p class="sub">Open the report to review passenger details, assigned seats, and seats remaining by flight.</p><div class="actions"><span class="hint">Admin demo account has access to every reservation on this browser.</span><button class="primary" id="openAdminReport">Open admin report</button></div>`;document.querySelector('#openAdminReport').addEventListener('click',()=>showTab('admin'));}
  function seatFor(flight,date,seatClass){const current=Object.values(bookings()).filter(b=>b.flight===flight&&b.date===date&&b.seatClass===seatClass).map(b=>Number(b.seat.slice(b.seat.lastIndexOf('-')+1)));const prefix={'Economy':'E','Premium Economy':'PE','Business':'B','First Class':'F'}[seatClass];for(let i=1;i<=capacities[seatClass];i++)if(!current.includes(i))return prefix+'-'+String(i).padStart(3,'0');return null;}
  function countFor(flight,date,seatClass){return Object.values(bookings()).filter(b=>b.flight===flight&&b.date===date&&b.seatClass===seatClass).length;}
  function bookView(){
    document.querySelector('#panel').innerHTML=`<form id="bookForm"><div class="grid"><div class="field"><label for="passenger">Passenger name</label><input id="passenger" maxlength="100" required></div><div class="field"><label for="mobile">Mobile number (Indian 10-digit or international)</label><input id="mobile" type="tel" placeholder="98765 43210 or +1 415 555 2671" required></div><div class="field"><label for="flight">Flight number</label><select id="flight" required><option value="">Choose flight</option>${Object.entries(flights).map(([code,name])=>`<option value="${code}">${code} — ${name}</option>`).join('')}</select></div><div class="field"><label for="flightName">Flight details</label><input id="flightName" readonly placeholder="Auto-filled from flight number"></div><div class="field"><label for="seatClass">Class</label><select id="seatClass">${Object.keys(capacities).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field"><label for="date">Date of journey</label><input id="date" type="date" required></div><div class="field"><label for="source">Source airport</label><input id="source" required maxlength="100"></div><div class="field"><label for="destination">Destination airport</label><input id="destination" required maxlength="100"></div></div><div class="actions"><span class="hint" id="availability">Select flight and journey date to see available seats.</span><button class="primary">Book flight</button></div></form>`;
    const f=document.querySelector('#flight'),date=document.querySelector('#date'),cl=document.querySelector('#seatClass');date.min=new Date().toISOString().slice(0,10);
    const update=()=>{document.querySelector('#flightName').value=flights[f.value]||'';const n=countFor(f.value,date.value,cl.value);document.querySelector('#availability').textContent=f.value&&date.value?`Seats available in ${cl.value}: ${capacities[cl.value]-n} / ${capacities[cl.value]}`:'Select flight and journey date to see available seats.';};f.addEventListener('change',update);date.addEventListener('change',update);cl.addEventListener('change',update);
    const pending=sessionStorage.getItem('pendingFlight');if(pending){try{const pick=JSON.parse(pending);f.value=pick.flight||'';document.querySelector('#source').value=pick.source||'';document.querySelector('#destination').value=pick.destination||'';if(pick.date)date.value=pick.date;}catch(error){}sessionStorage.removeItem('pendingFlight');update();}
    document.querySelector('#bookForm').addEventListener('submit',e=>{e.preventDefault();const mobile=normalizeMobile(document.querySelector('#mobile').value),source=document.querySelector('#source').value.trim(),destination=document.querySelector('#destination').value.trim(),journey=date.value,seatClass=cl.value,flight=f.value;if(!mobile){flash('Enter a valid 10-digit Indian mobile number or an international number with + and country code.',true);return;}if(source.toLowerCase()===destination.toLowerCase()){flash('Source and destination airports must be different.',true);return;}if(journey<new Date().toISOString().slice(0,10)){flash('Journey date cannot be in the past.',true);return;}const seat=seatFor(flight,journey,seatClass);if(!seat){flash('This flight and class are fully booked for that date.',true);return;}const pnr='PNR'+crypto.randomUUID().replaceAll('-','').slice(0,10).toUpperCase();const b={pnr,passenger:document.querySelector('#passenger').value.trim(),mobile,flight,flightName:flights[flight],seatClass,date:journey,source,destination,seat,bookedBy:who()};const all=bookings();all[pnr]=b;save(all);showReceipt(b);});
  }
  function cancelView(){
    document.querySelector('#panel').innerHTML=`<form id="fetchForm"><div class="grid"><div class="field wide"><label for="pnr">PNR number</label><input id="pnr" placeholder="Enter the PNR from your confirmation" required></div></div><div class="actions"><span class="hint">Fetch booking details before confirming cancellation.</span><button class="primary">Fetch booking</button></div></form><div id="result" style="margin-top:20px"></div>`;
    document.querySelector('#fetchForm').addEventListener('submit',e=>{e.preventDefault();const key=document.querySelector('#pnr').value.trim().toUpperCase(),b=bookings()[key],result=document.querySelector('#result');if(!b||b.bookedBy!==who()){result.innerHTML='<p class="flash error">No active booking found for that PNR under this customer account.</p>';return;}result.innerHTML=`<div class="booking"><b>FLIGHT BOOKING DETAILS</b>\nPNR: ${esc(b.pnr)}\nPassenger: ${esc(b.passenger)}\nMobile: ${esc(b.mobile)}\nFlight: ${esc(b.flight)} — ${esc(b.flightName)}\nClass: ${esc(b.seatClass)}\nSeat: ${esc(b.seat)}\nDate: ${esc(b.date)}\nFrom: ${esc(b.source)}\nTo: ${esc(b.destination)}</div><div class="actions"><span class="hint">Cancellation permanently removes this booking.</span><button class="danger" id="cancelButton">Confirm cancellation</button></div>`;document.querySelector('#cancelButton').addEventListener('click',()=>confirmCancel(b));});
  }
  function confirmCancel(b){modalRoot.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2>Cancel this flight?</h2><p>Are you sure you want to cancel PNR <b>${esc(b.pnr)}</b>?</p><div class="dialog-actions"><button class="secondary" id="keep">Keep booking</button><button class="danger" id="yesCancel">Cancel flight</button></div></div></div>`;document.querySelector('#keep').onclick=()=>modalRoot.innerHTML='';document.querySelector('#yesCancel').onclick=()=>{const all=bookings();delete all[b.pnr];save(all);modalRoot.innerHTML='';cancelView();document.querySelector('#result').innerHTML='<p class="flash">Booking cancelled successfully.</p>';};}
  function adminView(){
    const all=Object.values(bookings()).sort((a,b)=>a.date.localeCompare(b.date)||a.flight.localeCompare(b.flight));
    const dates=[...new Set(all.map(b=>b.date))];if(!dates.length)dates.push(new Date().toISOString().slice(0,10));
    const summaries=dates.flatMap(date=>Object.keys(flights).flatMap(flight=>Object.keys(capacities).map(seatClass=>{const booked=countFor(flight,date,seatClass);return{flight,date,seatClass,capacity:capacities[seatClass],booked,available:capacities[seatClass]-booked};})));
    document.querySelector('#panel').innerHTML=`<div class="actions" style="margin-top:0"><div><h2 style="margin:0 0 5px">Admin flight report</h2><div class="small">${all.length} active booking${all.length===1?'':'s'} · 45 seats per flight, date, and class in this demo.</div></div><button class="primary" id="download">Download Excel CSV</button></div><h3 class="report-section">Booked passengers and assigned seats</h3><div class="table-wrap"><table><thead><tr><th>PNR</th><th>Passenger</th><th>Mobile</th><th>Flight</th><th>Date</th><th>Class</th><th>Seat</th></tr></thead><tbody>${all.map(b=>`<tr><td>${esc(b.pnr)}</td><td>${esc(b.passenger)}</td><td>${esc(b.mobile)}</td><td>${esc(b.flight)}</td><td>${esc(b.date)}</td><td>${esc(b.seatClass)}</td><td>${esc(b.seat)}</td></tr>`).join('')||'<tr><td colspan="7">No bookings yet.</td></tr>'}</tbody></table></div><h3 class="report-section">Seat availability</h3><div class="table-wrap"><table><thead><tr><th>Flight</th><th>Date</th><th>Class</th><th>Capacity</th><th>Booked</th><th>Available</th></tr></thead><tbody>${summaries.map(s=>`<tr><td>${esc(s.flight)}</td><td>${esc(s.date)}</td><td>${esc(s.seatClass)}</td><td>${s.capacity}</td><td>${s.booked}</td><td>${s.available}</td></tr>`).join('')}</tbody></table></div><p class="notice">CSV opens in Excel. This browser report includes only bookings stored on this device. For a shared admin report use the Java app and its SQLite database.</p>`;
    document.querySelector('#download').addEventListener('click',()=>downloadReport(all,summaries));
  }
  function downloadReport(all,summaries){const lines=['Booked passengers and assigned seats','PNR,Passenger,Mobile,Flight Number,Flight,Date,Class,Seat,From,To',...all.map(b=>[b.pnr,b.passenger,b.mobile,b.flight,b.flightName,b.date,b.seatClass,b.seat,b.source,b.destination].map(csv).join(',')),'','Seat availability','Flight Number,Date,Class,Capacity,Booked,Available',...summaries.map(s=>[s.flight,s.date,s.seatClass,s.capacity,s.booked,s.available].map(csv).join(','))];const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flight-reservations.csv';a.click();URL.revokeObjectURL(url);}
  function showReceipt(b){modalRoot.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="eyebrow">Booking confirmed</div><h2>Your seat is reserved</h2><div class="booking"><b>PNR: ${esc(b.pnr)}</b>\nPassenger: ${esc(b.passenger)}\nMobile: ${esc(b.mobile)}\nFlight: ${esc(b.flight)} — ${esc(b.flightName)}\nClass: ${esc(b.seatClass)}\nSeat: ${esc(b.seat)}\nDate: ${esc(b.date)}\nRoute: ${esc(b.source)} → ${esc(b.destination)}</div><p>Browser demo bookings do not send a real SMS. Configure Twilio in the Java app for SMS delivery.</p><div class="dialog-actions"><button class="primary" id="done">Done</button></div></div></div>`;document.querySelector('#done').onclick=()=>{modalRoot.innerHTML='';bookView();};}
  function flash(message,error=false){const old=document.querySelector('.flash');if(old)old.remove();const p=document.createElement('p');p.className='flash'+(error?' error':'');p.textContent=message;document.querySelector('#panel').prepend(p);}
  render();
})();
</script>
</body>
</html>
